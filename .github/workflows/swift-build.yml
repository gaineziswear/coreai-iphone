name: CoreAI iOS Native Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift dependencies
        working-directory: native
        run: swift package resolve

      - name: Build CoreAIIPhone
        working-directory: native
        run: swift build

      - name: Run Swift tests
        working-directory: native
        run: swift test
