name: CoreAI iOS Native Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Resolve Swift dependencies
        working-directory: native
        run: swift package resolve

      - name: Build CoreAIIPhone
        working-directory: native
        run: swift build

      - name: Run Swift tests
        working-directory: native
        run: swift test
